# =============================================================================
# Project : Project 6 - Python (FastAPI) App CI/CD on Google GKE
# Author  : Sanjay Naidu
# File    : app/pyproject.toml - dependencies, tooling and test settings
# =============================================================================
# Dependencies are resolved into uv.lock (every package pinned with hashes).
# CI and the Docker build both run `uv sync --frozen`, so they install exactly
# what was reviewed, and fail if pyproject.toml and the lock disagree.

[project]
name = "medicart"
version = "1.0.0"
description = "MediCart - online pharmacy demo (FastAPI + PostgreSQL) deployed to GKE"
authors = [{ name = "Sanjay Naidu" }]
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn>=0.38",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2",
    "sqlalchemy>=2.0.40",
    "psycopg[binary]>=3.2",
    "alembic>=1.16",
    "prometheus-client>=0.22",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "httpx2>=2.13",  # Starlette TestClient transport
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medicart"]

# ---------------------------------------------------------------------------
# Ruff: linter + formatter in one fast tool (replaces flake8, isort, black).
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, S bandit (security),
# UP pyupgrade, SIM simplify, RUF ruff-specific.
select = ["E", "W", "F", "I", "B", "S", "UP", "SIM", "RUF"]
ignore = [
    "B008", # FastAPI's Depends()/Form() in defaults is the framework's idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"] # asserts and fake passwords are fine in tests
"src/medicart/migrations/**" = ["E501"]

# ---------------------------------------------------------------------------
# Tests run against a REAL PostgreSQL (TEST_DATABASE_URL), not SQLite: row
# locks, CHECK constraints, JSONB and the audit trigger only behave like
# production on the real engine.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=medicart --cov-report=term-missing --cov-report=xml --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["medicart"]
omit = ["*/migrations/*", "*/__main__.py"]
