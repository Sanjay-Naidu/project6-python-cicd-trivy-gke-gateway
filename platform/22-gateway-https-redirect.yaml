# =============================================================================
# Project : Project 6 - Python (FastAPI) App CI/CD on Google GKE
# Author  : Sanjay Naidu
# File    : platform/22-gateway-https-redirect.yaml - HTTPS only, HTTP redirects (stage 3)
# =============================================================================
# Apply this INSTEAD of 21-gateway-https.yaml, but only once the certificate
# shows ACTIVE (docs/SETUP.md, Phase 13). Redirecting while the cert is still
# PROVISIONING would send every visitor to an HTTPS endpoint that can't
# complete a TLS handshake yet.
#
# The trick that keeps the app's HTTPRoutes unchanged:
#   - the http listener now only accepts routes from ITS OWN namespace
#     (gateway-infra), where the redirect route below lives;
#   - the https listener accepts routes from the labelled app namespaces.
# The app routes don't name a listener, so they attach wherever they're
# allowed, which is now only https. Plain HTTP gets a 301 to HTTPS.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: medicart-gateway
  namespace: gateway-infra
  labels:
    app.kubernetes.io/part-of: medicart
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
    - type: NamedAddress
      value: medicart-ip
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        options:
          # A classic Google-managed SSL certificate created in the console
          # (Load balancing -> Certificates). Google issues and renews it
          # automatically once DNS for its domains points at medicart-ip.
          networking.gke.io/pre-shared-certs: medicart-cert
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access: "true"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: gateway-infra
  labels:
    app.kubernetes.io/part-of: medicart
spec:
  parentRefs:
    - name: medicart-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
