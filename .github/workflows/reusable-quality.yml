# =============================================================================
# Project : Project 6 - Python (FastAPI) App CI/CD on Google GKE
# Author  : Sanjay Naidu
# File    : .github/workflows/reusable-quality.yml
# =============================================================================
# WHY a reusable workflow: PR validation AND the main deploy pipeline both
# need identical lint/test/manifest checks. Defining them once means the two
# pipelines can never drift apart.
#
# Every third-party action is pinned to a full commit SHA (tag in the
# comment). Tags can be moved by whoever controls the action's repo, and a
# SHA cannot. Dependabot keeps the SHAs current.

name: Reusable - Code Quality

on:
  workflow_call: {}

permissions:
  contents: read

env:
  UV_VERSION: "0.12.18"
  KUBECONFORM_VERSION: v0.8.0
  KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883

jobs:
  python:
    name: Lint + tests (real PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway PostgreSQL for the test suite: the same major version as
    # production, so row locks, CHECK constraints, JSONB and the audit
    # trigger are tested for real (SQLite would silently skip half of that).
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medicart_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv + Python 3.13
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13" # the same minor version the distroless image runs
          enable-cache: true
          cache-dependency-glob: app/uv.lock

      # --frozen: install exactly uv.lock, and fail if pyproject.toml and the
      # lock disagree (someone added a dependency without re-locking).
      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint (incl. bandit security rules)
        run: uv run ruff check --output-format=github .

      - name: Ruff format check
        run: uv run ruff format --check .

      # Also runs the real migrations (Alembic under the advisory lock) and
      # enforces the 85% coverage gate from pyproject.toml.
      - name: pytest
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/medicart_test
        run: uv run pytest

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          print(f"### Test coverage\n\nLine coverage: **{float(root.get('line-rate')) * 100:.1f}%**, "
                f"branch coverage: **{float(root.get('branch-rate')) * 100:.1f}%**")
          EOF
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: app/coverage.xml
          retention-days: 14
          if-no-files-found: ignore

  manifests:
    name: Kubernetes manifests (render + schema validation)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Download pinned by version AND checksum: a tampered release asset
      # fails here instead of running in CI.
      - name: Install kubeconform
        run: |
          curl -fsSL -o kc.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kc.tgz" | sha256sum -c -
          tar -xzf kc.tgz -C "$RUNNER_TEMP" kubeconform
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Render both environments through the SAME script the deploy job uses,
      # with placeholder values, and validate every object. GKE and Gateway
      # CRDs (HTTPRoute, HealthCheckPolicy, SecretProviderClass...) are
      # checked against the community CRD schema catalog.
      - name: Render and validate (dev + prod + platform)
        env:
          GCP_PROJECT_ID: ci-project
          APP_IMAGE: us-central1-docker.pkg.dev/ci-project/medicart/medicart:sha-0000000
          APP_VERSION: sha-0000000
          POSTGRES_IMAGE: us-central1-docker.pkg.dev/ci-project/dockerhub/library/postgres:18.6-alpine3.24
        run: |
          set -euo pipefail
          SCHEMAS=(-schema-location default
                   -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json')
          for env in dev prod; do
            echo "::group::$env"
            APP_HOSTNAME="$env.ci.example.com" bash k8s/render.sh "$env" > "rendered-$env.yaml"
            kubeconform -strict -summary "${SCHEMAS[@]}" "rendered-$env.yaml"
            echo "::endgroup::"
          done
          kubeconform -strict -summary "${SCHEMAS[@]}" platform/

      # The guards must keep working: prove the renderer REFUSES a mutable
      # tag and a missing variable.
      - name: Renderer rejects 'latest' tags and missing variables
        env:
          GCP_PROJECT_ID: ci-project
          APP_HOSTNAME: ci.example.com
          APP_VERSION: latest
          POSTGRES_IMAGE: postgres:18
        run: |
          if APP_IMAGE=example/medicart:latest bash k8s/render.sh prod >/dev/null 2>&1; then
            echo "::error::render.sh accepted a :latest image"; exit 1
          fi
          if APP_IMAGE=example/medicart:sha-0000000 GCP_PROJECT_ID= bash k8s/render.sh prod >/dev/null 2>&1; then
            echo "::error::render.sh rendered without GCP_PROJECT_ID"; exit 1
          fi
          echo "guards OK"
