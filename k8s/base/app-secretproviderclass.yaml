# =============================================================================
# Project : Project 6 - Python (FastAPI) App CI/CD on Google GKE
# Author  : Sanjay Naidu
# File    : k8s/base/app-secretproviderclass.yaml - secrets from Secret Manager
# =============================================================================
# The GKE Secret Manager add-on (a CSI driver) fetches these secrets when the
# pod starts, authenticating AS THE POD'S ServiceAccount, and mounts them as
# files on an in-memory volume at /var/run/secrets/medicart.
#
# WHY not a Kubernetes Secret: those are only base64 in etcd, readable by
# anyone with `get secrets` in the namespace, and would need a way to get
# the value into the cluster (a pipeline step holding the secret). Here the
# value lives only in Secret Manager: versioned, audited, access-controlled
# per secret with IAM. The pipeline never sees it.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: medicart-app-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/medicart-${APP_ENV}-db-password/versions/latest"
        path: "db-password"
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/medicart-${APP_ENV}-session-key/versions/latest"
        path: "session-key"
