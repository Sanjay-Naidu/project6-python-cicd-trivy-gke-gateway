# Separate identity from the app: its SecretProviderClass only mounts the
# database password, never the session signing key.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
automountServiceAccountToken: false
