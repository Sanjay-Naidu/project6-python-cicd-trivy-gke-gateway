# PostgreSQL reads its superuser password from POSTGRES_PASSWORD_FILE on
# first start (initdb). The same Secret Manager secret feeds the app, so the
# two can never disagree.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: postgres-secrets
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/${GCP_PROJECT_ID}/secrets/medicart-${APP_ENV}-db-password/versions/latest"
        path: "db-password"
