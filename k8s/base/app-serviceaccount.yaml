# The pod's identity. Through Workload Identity Federation for GKE this
# Kubernetes ServiceAccount is ALSO a Google Cloud principal:
#   principal://iam.googleapis.com/projects/<NUMBER>/locations/global/
#     workloadIdentityPools/<PROJECT_ID>.svc.id.goog/subject/ns/<ns>/sa/medicart
# In the console, that principal (or its whole namespace) was granted
# "Secret Manager Secret Accessor" on this environment's secrets only.
# No Google service account, no JSON key.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: medicart
  labels:
    app.kubernetes.io/name: medicart
# The app never calls the Kubernetes API, so don't hand it a token.
automountServiceAccountToken: false
